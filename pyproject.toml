[project]
name = "books"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ebooklib>=0.21",
    "lxml>=6.1.3",
    "requests>=2.34.2",
]

[project.scripts]
books = "books:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "snakemake>=9.27.2",
]
